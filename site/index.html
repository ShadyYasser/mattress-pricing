<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسعير المراتب</title>

<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e2e5ea;--ink:#1c2430;--muted:#6b7480;--pri:#1d4e89;--pri-soft:#e8f0fa;--ok:#0f7a52;--warn:#b45309;--warn-soft:#fff6e6;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top h1{font-size:19px;margin:0;font-weight:700}
.status{font-size:13px;color:var(--muted);margin-inline-start:auto}
.status.dirty{color:var(--warn);font-weight:600}
.status.err{color:var(--danger);font-weight:600}
.status.ok{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f2f5}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.icon{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:6px}
.icon:hover{background:#fdecec;color:var(--danger)}
.menu{position:relative}
.menu-pop{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);min-width:220px;padding:6px;display:none;z-index:9}
.menu-pop.open{display:block}
.menu-pop .who{padding:8px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;direction:ltr;text-align:right}
.menu-pop button{display:block;width:100%;text-align:right;border:none;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--pri-soft)}
nav.tabs{display:flex;gap:4px;padding:6px 20px 0;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs button{border:none;background:none;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
main{padding:20px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1}
.muted{color:var(--muted);font-size:13px}
.note{background:var(--warn-soft);border:1px solid #f3d9a8;color:#7a4a05;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note.info{background:var(--pri-soft);border-color:#c9daf0;color:#163c69}
.note.err{background:#fdecec;border-color:#f5c2c0;color:#7a1a12}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
table.price td.n,table.price th.n{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.price td.n{font-weight:600}
table.price tr.grp td{background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px}
table.price td.name{font-weight:600;white-space:nowrap}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0ea;border-color:var(--pri)}
input.sm{width:72px}input.md{width:100px}input.w{width:100%}
table.items td{padding:5px 6px}
table.items tr.sub td{background:#fafbfc;font-size:13px;border-bottom:1px solid var(--line)}
table.items tr[data-iid]:has(+tr.sub) td{border-bottom:none}
table.items input[data-f=name]{width:100%;min-width:170px}
.model-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.model-head .m-name{flex:1;min-width:200px;font-weight:600;font-size:16px}
.pill{background:var(--pri-soft);color:var(--pri);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table.parts td{padding:5px 6px}
table.parts select{width:100%;min-width:160px}
table.bd td,table.bd th{font-size:13px;padding:5px 8px}
table.bd td.n{text-align:center;font-variant-numeric:tabular-nums}
table.bd tfoot td{font-weight:700;border-bottom:none}
table.bd tfoot tr.sale td{color:var(--ok)}
table.bd tfoot tr.offer td{color:var(--warn)}
.form{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;max-width:720px}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:30px}
ul.how{margin:6px 0 0;padding-inline-start:20px}ul.how li{margin-bottom:4px}
.auth{max-width:380px;margin:9vh auto;padding:0 16px}
.auth .card{padding:24px}
.auth h1{font-size:22px;margin:0 0 4px}
.auth label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.auth input{width:100%;padding:9px 10px}
.auth .btn{width:100%;margin-top:18px;padding:10px}
.auth .msg{margin-top:12px;font-size:14px;color:var(--danger);min-height:20px}
.ltr{direction:ltr;unicode-bidi:isolate}
.creds{background:#f8fafc;border:1px dashed #b9c6d6;border-radius:10px;padding:12px 14px;margin-top:12px;white-space:pre-line;font-size:14px}
.loading{text-align:center;color:var(--muted);padding:15vh 0}
@media print{
  header.top,nav.tabs,.bar button,.bar .switch,.no-print,#toast{display:none!important}
  body{background:#fff}main{padding:0;max-width:none}
  .card{border:none;padding:0;margin-bottom:18px;break-inside:avoid}
  .print-title{display:block!important}
}
.print-title{display:none;font-size:18px;font-weight:700;margin-bottom:10px}
</style>
</head>

(function(){

,"hOverride":0,"parts":[{"itemId":"i1","qty":1},{"itemId":"s3","qty":2},{"itemId":"r2","qty":2},{"itemId":"c1","qty":1},{"itemId":"f1","qty":1},{"itemId":"g1","qty":1},{"itemId":"tp","qty":1},{"itemId":"pk","qty":1},{"itemId":"ac","qty":1},{"itemId":"lb","qty":1}]},{"id":"m2","name":"طبي ريبوند 20","type":"medical","hOverride":0,"parts":[{"itemId":"i1","qty":1},{"itemId":"r5","qty":4},{"itemId":"f1","qty":1},{"itemId":"g1","qty":1},{"itemId":"tp","qty":1},{"itemId":"pk","qty":1},{"itemId":"ac","qty":1},{"itemId":"lb","qty":1}]},{"id":"m3","name":"طبي إسفنج وريبوند 25","type":"medical","hOverride":0,"parts":[{"itemId":"i1","qty":1},{"itemId":"s5","qty":3},{"itemId":"r5","qty":2},{"itemId":"f1","qty":1},{"itemId":"g1","qty":1},{"itemId":"tp","qty":1},{"itemId":"pk","qty":1},{"itemId":"ac","qty":1},{"itemId":"lb","qty":1}]}]};

let sb=null,me=null,S=null,rev=0,PL=null;
let dirty=false,saving=false,saveAgain=false,saveErr=false,conflict=false,saveTimer=null,lastSaved=null;
let view="tables",itemFilter="all",menuOpen=false,newCreds=null;
const previewW={};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4);
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0;};
const fmt=(n,d)=>(isFinite(n)?n:0).toLocaleString("en-US",{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const fmtH=h=>String(Math.round(h*10)/10);
const fmtDate=iso=>{try{return iso?new Date(iso).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"}):"";}catch(e){return"";}};
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3500);}
function genPassword(){const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";const r=new Uint32Array(10);crypto.getRandomValues(r);return Array.from(r,x=>a[x%a.length]).join("");}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("اتنسخ ✓");}catch(e){toast("النسخ مش متاح — حدد النص وانسخه بإيدك");}}
function downloadFile(name,text,type){const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const ERR={email_exists:"الإيميل ده عليه حساب بالفعل",weak_password:"كلمة السر لازم تكون 8 حروف على الأقل",invalid_email:"الإيميل مش مكتوب صح",not_owner:"الإجراء ده للمالك بس",cannot_delete_self:"مينفعش تمسح حسابك",not_viewer:"الإجراء ده للمشاهدين بس"};
function errMsg(e){const m=(e&&(e.message||e.error_description))||"";for(const k in ERR)if(m.includes(k))return ERR[k];if(/Invalid login/i.test(m))return"الإيميل أو كلمة السر غلط";if(/fetch|network/i.test(m))return"مفيش اتصال بالإنترنت";return"حصل خطأ: "+m;}

/* ---------- calculation ---------- */
const LEN=()=>num(S.settings.length)||2;
const LCM=()=>Math.round(LEN()*100);
const sz=(w,lcm)=>'<span class="ltr">'+w+'×'+lcm+'</span>';
const itemById=id=>S.items.find(i=>i.id===id);
function blk(it){const b=it.block||{};return{l:num(b.l)||200,w:num(b.w)||120,h:num(b.h)||100,price:num(b.price)};}
function blockM3(it){const b=blk(it),v=b.l*b.w*b.h/1e6;return v>0?b.price/v:0;}
function pricePerM2(it){if(it.basis==="block")return blockM3(it)*num(it.t)/100;return it.basis==="sheet"?num(it.price)/LEN():num(it.price);}
const refW=it=>(num(it.refW)||100)/100;
function areaOf(it,W,Hm){const L=LEN();switch(it.method){case"face":return W*L;case"twoFaces":return 2*W*L;case"sides":return 2*(W+L)*Hm;case"cover":return 2*W*L+2*(W+L)*Hm;default:return 0;}}
function partCost(it,qty,W,Hm){if(!it)return 0;const q=num(qty);if(it.method==="fixed")return num(it.price)*q;if(it.method==="perWidth")return num(it.price)*W/refW(it)*q;return pricePerM2(it)*areaOf(it,W,Hm)*q*(1+num(it.waste)/100);}
function autoHeight(m){return m.parts.reduce((s,p)=>{const it=itemById(p.itemId);if(!it)return s;const t=num(it.t)*num(p.qty);return s+(it.method==="face"?t:it.method==="twoFaces"?2*t:0);},0);}
function heightOf(m){return num(m.hOverride)>0?num(m.hOverride):autoHeight(m);}
function costOf(m,Wcm){const W=Wcm/100,Hm=heightOf(m)/100;return m.parts.reduce((s,p)=>s+partCost(itemById(p.itemId),p.qty,W,Hm),0);}
function roundUp(x){const st=num(S.settings.round);return st>0?Math.ceil(x/st-1e-9)*st:x;}
// price levels: cost -> base (father's sale price) -> mine (my price to customers) -> offer (pre-discount)
function normalize(){const st=S.settings;st.margins=st.margins||{spring:0,medical:0};st.myMargins=st.myMargins||{spring:0,medical:0};st.offer=st.offer||{on:false,pct:0};st.viewer=Object.assign({base:false,mine:true,offer:true},st.viewer||{});}
function baseOf(m,Wcm){return roundUp(costOf(m,Wcm)*(1+num(S.settings.margins[m.type])/100));}
function mineOf(m,Wcm){return roundUp(baseOf(m,Wcm)*(1+num(S.settings.myMargins[m.type])/100));}
function offerOf(m,Wcm){return roundUp(mineOf(m,Wcm)*(1+num(S.settings.offer.pct)/100));}
function valueOf(kind,m,w){return kind==="cost"?costOf(m,w):kind==="base"?baseOf(m,w):kind==="mine"?mineOf(m,w):offerOf(m,w);}
const KINDS={cost:"سعر التصنيع (التكلفة)",base:"سعر الوالد (البيع الأساسي)",mine:"سعري (البيع للعميل)",offer:"سعر العروض (قبل الخصم)"};
const VIEWER_KINDS={base:"السعر الأساسي",mine:"سعر البيع",offer:"سعر العروض (قبل الخصم)"};
function viewerKinds(){const v=S.settings.viewer;return["base","mine","offer"].filter(k=>v[k]&&(k!=="offer"||S.settings.offer.on));}
function groupNote(kind,t){const st=S.settings;if(kind==="cost"||kind==="base")return"ربح الوالد "+fmt(num(st.margins[t]))+"%";if(kind==="mine")return"نسبتي "+fmt(num(st.myMargins[t]))+"%";return"عرض "+fmt(num(st.offer.pct))+"%";}
function sortedModels(){return["spring","medical"].flatMap(t=>S.models.filter(m=>m.type===t));}
function buildPriceList(){
  const ws=S.settings.widths;
  const kinds=viewerKinds(); // only the levels viewers may see are written
  return{updatedAt:S.updatedAt||new Date().toISOString(),lengthCm:LCM(),widths:ws,kinds,
    models:sortedModels().map(m=>({name:m.name,type:m.type,height:Math.round(heightOf(m)*10)/10,prices:Object.fromEntries(kinds.map(k=>[k,ws.map(w=>valueOf(k,m,w))]))}))};
}

function unitHint(it){
  if(AREA[it.method]){const v=pricePerM2(it)*LEN();return fmt(v,1)+" ج للمتر"+(it.basis==="block"?" بسمك "+fmtH(num(it.t))+" سم":"");}
  if(it.method==="perWidth")return fmt(num(it.price)/refW(it),1)+" ج لمرتبة عرضها متر";
  return fmt(num(it.price))+" ج للمرتبة";
}
function blockHint(it){const b=blk(it),m3=blockM3(it);return"المتر المكعب = "+fmt(m3,1)+" ج · 1 سم للمتر (1×"+fmtH(LEN())+") = "+fmt(m3*0.01*LEN(),2)+" ج";}
// quantity used, in the unit the factory counts ("متر" = piece 1 m wide × length)
function usageText(it,qty,W,Hm){
  const q=num(qty),L=LEN(),wf=1+num(it.waste)/100;
  if(it.method==="fixed")return"—";
  if(it.method==="perWidth")return"عرض "+fmt(W*100)+" سم";
  const unit=it.basis==="m2"?" م²":" متر",d=it.basis==="m2"?1:L;
  const a=x=>fmt(x/d,2);
  if(it.method==="cover"){const f=2*W*L*q,sd=2*(W+L)*Hm*q;return'<div>'+a((f+sd)*wf)+unit+'</div><div class="muted">فوق '+a(f/2)+' + تحت '+a(f/2)+' + جوانب '+a(sd)+(num(it.waste)?' + هالك '+fmt(num(it.waste))+'%':'')+'</div>';}
  return a(areaOf(it,W,Hm)*q*wf)+unit;
}

/* ---------- generic price table (owner & viewer) ---------- */
// src: {widths, lengthCm, models:[{name,type,height,values:[]}]}
function priceTableHTML(kind,title,src,opts){
  opts=opts||{};
  let h='<div class="card"><div class="bar"><h2 class="grow" style="margin:0">'+title+'</h2><button class="btn sm" data-act="copy-table" data-kind="'+kind+'">نسخ للإكسل</button><button class="btn sm" data-act="csv" data-kind="'+kind+'">تنزيل CSV</button></div>';
  if(!src.models.length)return h+'<div class="empty">مفيش مراتب لسه</div></div>';
  h+='<div class="scroll"><table class="price"><thead><tr><th>المرتبة</th><th class="n">الارتفاع</th>'+src.widths.map(w=>'<th class="n">'+sz(w,src.lengthCm)+'</th>').join("")+'</tr></thead><tbody>';
  for(const t of["spring","medical"]){
    const group=src.models.filter(m=>m.type===t);if(!group.length)continue;
    h+='<tr class="grp"><td colspan="'+(src.widths.length+2)+'">'+TYPES[t]+(opts.notes?' · '+groupNote(kind,t):'')+'</td></tr>';
    for(const m of group)h+='<tr><td class="name">'+esc(m.name)+'</td><td class="n">'+fmtH(m.height)+' سم</td>'+m.values.map(v=>'<td class="n">'+fmt(v)+'</td>').join("")+'</tr>';
  }
  return h+'</tbody></table></div></div>';
}
function tableSource(kind){
  if(me.role==="owner"){const ws=S.settings.widths;return{widths:ws,lengthCm:LCM(),models:sortedModels().map(m=>({name:m.name,type:m.type,height:heightOf(m),values:ws.map(w=>valueOf(kind,m,w))}))};}
  return{widths:PL.widths,lengthCm:PL.lengthCm,models:PL.models.map(m=>({name:m.name,type:m.type,height:m.height,values:(m.prices&&m.prices[kind])||(kind==="offer"?m.offer:m.sale)||[]}))};
}
function tableRows(kind){
  const src=tableSource(kind);
  const rows=[["المرتبة","النوع","الارتفاع (سم)"].concat(src.widths.map(w=>w+"x"+src.lengthCm))];
  for(const m of src.models)rows.push([m.name,TYPES[m.type],fmtH(m.height)].concat(m.values.map(v=>Math.round(v))));
  return rows;
}
const KIND_NAME={cost:"سعر-التصنيع",base:"سعر-الوالد",mine:"سعري",offer:"سعر-العروض",sale:"سعر-البيع"};

/* ---------- saving ---------- */
function markDirty(){dirty=true;updateStatus();clearTimeout(saveTimer);if(!conflict)saveTimer=setTimeout(save,1200);}
async function save(){
  if(conflict)return;
  if(saving){saveAgain=true;return;}
  clearTimeout(saveTimer);saving=true;dirty=false;saveErr=false;updateStatus();
  S.updatedAt=new Date().toISOString();
  const {data:rows,error}=await sb.from("pricing_state").update({data:S,rev:rev+1,updated_at:S.updatedAt,updated_by:me.user_id}).eq("id",1).eq("rev",rev).select("rev");
  if(error){saving=false;dirty=true;saveErr=true;updateStatus();saveTimer=setTimeout(save,6000);return;}
  if(!rows||!rows.length){saving=false;dirty=true;conflict=true;updateStatus();renderBanners();return;}
  rev=rows[0].rev;
  const r2=await sb.from("price_list").upsert({id:1,data:buildPriceList(),updated_at:S.updatedAt});
  saving=false;
  if(r2.error){dirty=true;saveErr=true;saveTimer=setTimeout(save,6000);}
  else lastSaved=new Date();
  updateStatus();
  if(saveAgain||(dirty&&!saveErr)){saveAgain=false;save();}
}
async function reloadLatest(){
  const {data,error}=await sb.from("pricing_state").select("data,rev").eq("id",1).single();
  if(error){toast(errMsg(error));return;}
  S=data.data;rev=data.rev;normalize();conflict=false;dirty=false;saveErr=false;updateStatus();renderBanners();renderView();toast("اتحمّلت آخر نسخة");
}
async function overwrite(){
  const {data,error}=await sb.from("pricing_state").select("rev").eq("id",1).single();
  if(error){toast(errMsg(error));return;}
  rev=data.rev;conflict=false;renderBanners();save();
}
window.addEventListener("beforeunload",e=>{if(me&&me.role==="owner"&&(dirty||saving)){e.preventDefault();e.returnValue="";}});

async function boot(){
  if(!window.supabase){renderMessage("مش قادر يحمّل","اتأكد من الإنترنت وحمّل الصفحة تاني.");return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")renderLogin();});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return renderLogin();
  await loadMe();
}
async function loadMe(){
  $("#app").innerHTML='<div class="loading">جاري التحميل...</div>';
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return renderLogin();
  const {data,error}=await sb.from("members").select("*").eq("user_id",user.id).maybeSingle();
  if(error)return renderMessage("حصل خطأ",esc(errMsg(error)));
  if(!data)return renderMessage("مفيش صلاحية","الحساب ده مش متضاف للموقع. اطلب من صاحب الحساب يضيفك.");
  me=data;
  if(me.must_change_password)return renderChangePw(true);
  if(me.role==="owner")await loadOwner();else await loadViewer();
}
async function loadOwner(){
  const {data,error}=await sb.from("pricing_state").select("data,rev").eq("id",1).maybeSingle();
  if(error)return renderMessage("حصل خطأ",esc(errMsg(error)));
  if(!data){
    S=JSON.parse(JSON.stringify(SAMPLE));normalize();S.updatedAt=new Date().toISOString();
    const ins=await sb.from("pricing_state").insert({id:1,data:S,rev:1,updated_by:me.user_id});
    if(ins.error)return renderMessage("حصل خطأ",esc(errMsg(ins.error)));
    rev=1;await sb.from("price_list").upsert({id:1,data:buildPriceList(),updated_at:S.updatedAt});
  }else{S=data.data;rev=data.rev;normalize();sb.from("price_list").upsert({id:1,data:buildPriceList(),updated_at:S.updatedAt||new Date().toISOString()}).then(()=>{});}
  try{const h=location.hash.slice(1);if(OWNER_VIEWS[h])view=h;}catch(e){}
  renderShell();
}
async function loadViewer(){
  const {data,error}=await sb.from("price_list").select("data,updated_at").eq("id",1).maybeSingle();
  if(error)return renderMessage("حصل خطأ",esc(errMsg(error)));
  PL=data?data.data:null;view="tables";renderShell();
}

function updateStatus(){
  const st=$("#status");if(!st)return;

  if(conflict){st.textContent="فيه تعديل من جهاز تاني";st.classList.add("err");}
  else if(saveErr){st.textContent="الحفظ فشل — هيحاول تاني";st.classList.add("err");}
  else if(saving){st.textContent="بيحفظ...";}
  else if(dirty){st.textContent="فيه تعديلات هتتحفظ حالاً";st.classList.add("dirty");}
  else{st.textContent=lastSaved?"اتحفظ ✓ "+lastSaved.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}):(S.updatedAt?"آخر حفظ "+fmtDate(S.updatedAt):"");st.classList.add("ok");}

function renderBanners(){
  const b=$("#banners");if(!b)return;let h="";

    if(conflict)h+='<div class="note err">الأسعار اتعدّلت من جهاز أو تاب تاني، فتعديلاتك هنا ما اتحفظتش. <button class="btn sm" data-act="reload-latest">حمّل آخر نسخة</button><button class="btn sm" data-act="overwrite">احفظ نسختي فوقها</button></div>';

function renderView(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===view));

function viewSetup(){
  const s=S.settings;
  return'<div class="card"><h2>المقاسات والأسعار</h2><div class="form">'+
   '<label>الطول الثابت (متر)</label><div><input type="number" step="any" class="sm" data-sf="length" value="'+num(s.length)+'"></div>'+
   '<label>العروض (سم)</label><div><input type="text" class="w" id="widths" value="'+s.widths.join("، ")+'"><div class="muted">افصل بينهم بفاصلة، مثلاً: 90، 100، 120، 160</div></div>'+
   '<label>ربح الوالد — سوست %</label><div><input type="number" step="any" class="sm" data-sf="margins.spring" value="'+num(s.margins.spring)+'"> <span class="muted">على التكلفة</span></div>'+
   '<label>ربح الوالد — طبي %</label><div><input type="number" step="any" class="sm" data-sf="margins.medical" value="'+num(s.margins.medical)+'"> <span class="muted">على التكلفة</span></div>'+
   '<label>نسبتي — سوست %</label><div><input type="number" step="any" class="sm" data-sf="myMargins.spring" value="'+num(s.myMargins.spring)+'"> <span class="muted">على سعر الوالد</span></div>'+
   '<label>نسبتي — طبي %</label><div><input type="number" step="any" class="sm" data-sf="myMargins.medical" value="'+num(s.myMargins.medical)+'"> <span class="muted">على سعر الوالد</span></div>'+
   '<label>تقريب الأسعار لأقرب</label><div><input type="number" step="any" class="sm" data-sf="round" value="'+num(s.round)+'"> <span class="muted">جنيه (0 = من غير تقريب)</span></div>'+
   '<label>جدول العروض</label><div><label class="switch"><input type="checkbox" data-sf="offer.on" '+(s.offer.on?"checked":"")+'> مفعّل</label> &nbsp; زيادة <input type="number" step="any" class="sm" data-sf="offer.pct" value="'+num(s.offer.pct)+'"> % على سعري</div>'+
   '<label>المشاهدين يشوفوا</label><div><label class="switch"><input type="checkbox" data-sf="viewer.base" '+(s.viewer.base?"checked":"")+'> سعر الوالد</label> &nbsp; <label class="switch"><input type="checkbox" data-sf="viewer.mine" '+(s.viewer.mine?"checked":"")+'> سعري</label> &nbsp; <label class="switch"><input type="checkbox" data-sf="viewer.offer" '+(s.viewer.offer?"checked":"")+'> سعر العروض</label><div class="muted">التكلفة عمرها ما بتوصل للمشاهدين. سعر العروض بيظهر لهم بس لو جدول العروض مفعّل.</div></div>'+
   '</div></div>'+
   '<div class="card"><h2>الحساب بيمشي إزاي</h2><ul class="how muted">'+
   '<li><b>وش واحد</b> (إسفنج، ريبوند، شاسيه): العرض × الطول × عدد الطبقات × السعر.</li>'+
   '<li><b>وشين</b>: نفس اللي فوق × 2.</li>'+
   '<li><b>الجوانب</b> (لباد جوانب): 2 × (العرض + الطول) × الارتفاع.</li>'+
   '<li><b>فوق + تحت + جوانب</b> (القماش): مرتبة متر بتاخد متر فوق ومتر تحت، والجوانب = 2 × (العرض + الطول) × الارتفاع ÷ '+fmtH(LEN())+', وبعدين يتزوّد الهالك. في «المراتب» بتلاقي الكمية متقسمة فوق وتحت وجوانب.</li>'+
   '<li><b>حسب عرض المرتبة</b> (لباد، تيب، تغليف): تكتب السعر لمرتبة عرض معيّن، ويتقسم ويتضرب في العرض. مثلاً لباد 140 ج لمرتبة 120 ← مرتبة 160 = 140 ÷ 1.2 × 1.6.</li>'+
   '<li><b>ثابت</b> (غراء، زوايا وبوستر، مصنعية): نفس السعر في كل المقاسات.</li>'+
   '<li><b>من البلوك</b> (إسفنج، ريبوند): سعر البلوك ÷ حجمه بالمتر المكعب = سعر المتر المكعب، وبعدين × مساحة الطبقة × سُمكها.</li>'+
   '<li>«المتر» معناه قطعة عرضها 1 متر وطولها '+LCM()+' سم، والسعر «للمتر المربع» بيتضرب في المساحة على طول.</li>'+
   '<li>الارتفاع = مجموع سُمك طبقات «وش واحد» + سُمك «الوشين» × 2، إلا لو كتبت ارتفاع يدوي.</li>'+
   '<li>سعر الوالد = التكلفة × (1 + ربح الوالد). سعري = سعر الوالد × (1 + نسبتي). سعر العروض = سعري × (1 + نسبة العرض). وكل سعر بيتقرّب لفوق.</li>'+
   '<li>المشاهدين بيشوفوا الأسعار اللي انت معلّم عليها في «المشاهدين يشوفوا» بس — مش بيشوفوا التكلفة ولا المكونات.</li></ul></div>';
}

/* ---------- owner: users ---------- */
async function loadUsers(){
  const {data,error}=await sb.from("members").select("*").order("created_at");
  if(view!=="users")return;
  const v=$("#view");
  if(error){v.innerHTML='<div class="card note err">'+esc(errMsg(error))+'</div>';return;}
  let h='<div class="card"><h2>إضافة مشاهد</h2><p class="muted">المشاهد بيشوف '+(viewerKinds().map(k=>"«"+KINDS[k].split(" (")[0]+"»").join(" و")||"ولا جدول")+' بس (بتغيّرها من «الإعدادات»)، من غير التكلفة والمكونات، ومايقدرش يعدّل. هتديله كلمة سر مؤقتة وهو هيغيّرها أول ما يدخل.</p>'+
   '<form id="add-viewer" class="bar"><input type="email" id="v-email" class="ltr" placeholder="الإيميل" required style="min-width:240px">'+
   '<input type="text" id="v-pw" class="ltr" value="'+genPassword()+'" minlength="8" required style="width:150px" title="كلمة السر المؤقتة">'+
   '<button class="btn sm" type="button" data-act="gen-pw">كلمة سر تانية</button><button class="btn pri" type="submit">إضافة</button></form>';
  if(newCreds)h+='<div class="creds" id="creds">'+esc(newCreds)+'</div><div class="bar" style="margin-top:8px"><button class="btn sm" data-act="copy-creds">نسخ البيانات عشان تبعتها</button></div>';
  h+='</div><div class="card scroll"><h2>المستخدمين</h2><table><thead><tr><th>الإيميل</th><th>الصلاحية</th><th>اتضاف</th><th></th></tr></thead><tbody>';
  for(const u of data){
    const isOwner=u.role==="owner";
    h+='<tr data-uid="'+u.user_id+'" data-email="'+esc(u.email)+'"><td class="ltr">'+esc(u.email)+'</td><td>'+(isOwner?"مالك":"مشاهد")+(u.must_change_password&&!isOwner?' <span class="muted">(لسه ما غيّرش كلمة السر)</span>':'')+'</td><td class="muted">'+esc(fmtDate(u.created_at))+'</td><td>'+
     (isOwner?'':'<button class="btn sm" data-act="reset-pw">كلمة سر جديدة</button> <button class="btn sm danger" data-act="del-user">حذف</button>')+'</td></tr>';
  }
  v.innerHTML=h+'</tbody></table></div>';
}
function credsText(email,pw){return"موقع أسعار المراتب:\n"+location.origin+location.pathname+"\nالإيميل: "+email+"\nكلمة السر المؤقتة: "+pw+"\n(هيطلب منك تغيّرها أول ما تدخل)";}

/* ---------- owner: backup ---------- */
function viewBackup(){
  return'<div class="card"><h2>تصدير البيانات</h2><p class="muted">كل المكونات والمراتب والإعدادات في ملف واحد. احتفظ بيه كنسخة احتياطية.</p>'+
   '<div class="bar"><button class="btn" data-act="export-copy">نسخ البيانات</button><button class="btn" data-act="export-dl">تنزيل ملف JSON</button></div></div>'+
   '<div class="card"><h2>استيراد بيانات</h2><p class="muted">الصق بيانات متصدّرة (من هنا أو من النسخة اللي كانت على Claude) أو اختار ملف JSON. هتستبدل كل البيانات الحالية وتتحفظ على طول — خد نسخة احتياطية الأول.</p>'+
   '<div class="bar"><input type="file" id="import-file" accept=".json,application/json"></div><textarea id="import-box" placeholder="الصق هنا..."></textarea><div class="bar" style="margin-top:8px"><button class="btn pri" data-act="import">استيراد</button></div></div>';
}

/* ---------- events ---------- */
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="login-form"){
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;$("#l-msg").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pw").value});
    btn.disabled=false;
    if(error){$("#l-msg").textContent=errMsg(error);return;}
    await loadMe();
  }
  if(f.id==="pw-form"){
    const p1=$("#p1").value,p2=$("#p2").value,msg=$("#p-msg");
    if(p1.length<8){msg.textContent="كلمة السر لازم تكون 8 حروف على الأقل";return;}
    if(p1!==p2){msg.textContent="الكلمتين مش زي بعض";return;}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    const {error}=await sb.auth.updateUser({password:p1});
    if(error){btn.disabled=false;msg.textContent=/different from the old/i.test(error.message)?"اختار كلمة سر مختلفة عن القديمة":errMsg(error);return;}
    await sb.rpc("password_changed");toast("كلمة السر اتغيّرت ✓");await loadMe();
  }
  if(f.id==="add-viewer"){
    const email=$("#v-email").value.trim(),pwv=$("#v-pw").value;
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    const {error}=await sb.rpc("create_viewer",{p_email:email,p_password:pwv});
    btn.disabled=false;
    if(error){toast(errMsg(error));return;}
    newCreds=credsText(email.toLowerCase(),pwv);toast("اتضاف ✓");loadUsers();
  }
});
document.addEventListener("input",e=>{
  const el=e.target;if(!el.closest||!S||!me||me.role!=="owner")return;
  const val=el.type==="number"?num(el.value):el.type==="checkbox"?el.checked:el.value;
  const irow=el.closest("[data-iid]");
  if(irow&&el.dataset.f){
    const it=itemById(irow.dataset.iid);if(!it)return;const f=el.dataset.f;
    if(f.includes(".")){const [a,k]=f.split(".");it[a]=Object.assign({},it[a]||{},{[k]:val});}else it[f]=val;
    if(f==="cat"){const d=CAT_DEFAULT[val]||["fixed","sheet"];it.method=d[0];it.basis=d[1];}
    if(f==="basis"&&val==="block"&&!it.block)it.block={l:200,w:120,h:100,price:0};
    markDirty();if(f==="cat"||f==="method"||f==="basis")renderView();else refreshItemHints(it.id);return;
  }
  const card=el.closest("[data-mid]");
  if(card){
    const m=S.models.find(x=>x.id===card.dataset.mid);if(!m)return;
    if(el.dataset.mf){m[el.dataset.mf]=val;markDirty();refreshModelCard(card);return;}
    if(el.dataset.pf){const p=m.parts[+el.closest("tr").dataset.pi];if(p){p[el.dataset.pf]=val;markDirty();refreshModelCard(card);}return;}
    if(el.dataset.pw){previewW[m.id]=num(el.value);refreshModelCard(card);return;}
  }
  if(el.dataset.sf){
    const path=el.dataset.sf.split(".");let o=S.settings;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=val;
    markDirty();if(el.type==="checkbox")renderView();return;
  }
  if(el.id==="item-filter"){itemFilter=el.value;renderView();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="widths"&&S){
    const ws=[...new Set(el.value.split(/[,،\s]+/).map(num).filter(n=>n>0))].sort((a,b)=>a-b);
    if(!ws.length){toast("اكتب عرض واحد على الأقل");el.value=S.settings.widths.join("، ");return;}
    S.settings.widths=ws;el.value=ws.join("، ");markDirty();
  }
  if(el.id==="import-file"&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{$("#import-box").value=r.result;};r.readAsText(el.files[0]);}
});
document.addEventListener("click",async e=>{
  const pop=$("#menu-pop");
  if(pop&&pop.classList.contains("open")&&!e.target.closest(".menu"))pop.classList.remove("open");
  const tab=e.target.closest("[data-view]");
  if(tab){view=tab.dataset.view;try{history.replaceState(null,"","#"+view);}catch(_){}renderView();window.scrollTo(0,0);return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest("[data-mid]"),m=card&&S&&S.models.find(x=>x.id===card.dataset.mid);
  const urow=b.closest("[data-uid]");
  switch(act){
    case"menu":pop.classList.toggle("open");break;
    case"logout":if(me&&me.role==="owner"&&(dirty||saving)){toast("استنى ثانية لحد ما التعديلات تتحفظ");break;}await sb.auth.signOut();renderLogin();break;
    case"change-pw":renderChangePw(false);break;
    case"back":await loadMe();break;
    case"print":if(pop)pop.classList.remove("open");if(me.role==="owner"&&view!=="tables"){view="tables";renderView();}setTimeout(()=>window.print(),100);break;
    case"reload-latest":reloadLatest();break;
    case"overwrite":overwrite();break;
    case"hide-sample":S.sample=false;markDirty();renderBanners();break;
    case"add-item":{const c=itemFilter==="all"?"sponge":itemFilter,d=CAT_DEFAULT[c],ni={id:uid("i"),name:"مكون جديد",cat:c,t:0,method:d[0],basis:d[1],price:0,waste:0};S.items.push(ni);markDirty();renderView();const row=document.querySelector('[data-iid="'+ni.id+'"]');if(row){row.scrollIntoView({block:"center"});row.querySelector("input").select();}break;}
    case"del-item":{const id=b.closest("[data-iid]").dataset.iid,used=S.models.filter(x=>x.parts.some(p=>p.itemId===id));if(used.length){toast("مستخدم في: "+used.map(x=>x.name).join("، ")+" — شيله منها الأول");break;}S.items=S.items.filter(i=>i.id!==id);markDirty();renderView();break;}
    case"add-model":{if(!S.items.length){toast("ضيف مكونات الأول");break;}const nm={id:uid("m"),name:"مرتبة جديدة",type:"spring",hOverride:0,parts:[]};S.models.unshift(nm);markDirty();renderView();const c=document.querySelector('[data-mid="'+nm.id+'"] .m-name');if(c){c.focus();c.select();}break;}
    case"dup-model":{const cp=JSON.parse(JSON.stringify(m));cp.id=uid("m");cp.name=m.name+" (نسخة)";S.models.splice(S.models.indexOf(m)+1,0,cp);markDirty();renderView();const c=document.querySelector('[data-mid="'+cp.id+'"]');if(c)c.scrollIntoView({block:"start"});break;}
    case"del-model":if(b.classList.contains("armed")){S.models=S.models.filter(x=>x!==m);markDirty();renderView();}else{b.classList.add("armed");b.textContent="متأكد؟";setTimeout(()=>{b.classList.remove("armed");b.textContent="حذف";},3000);}break;
    case"add-part":if(!S.items.length){toast("ضيف مكونات الأول");break;}m.parts.push({itemId:S.items[0].id,qty:1});markDirty();card.outerHTML=modelCard(m);break;
    case"del-part":m.parts.splice(+b.closest("tr").dataset.pi,1);markDirty();card.outerHTML=modelCard(m);break;
    case"copy-table":copyText(tableRows(b.dataset.kind).map(r=>r.join("\t")).join("\n"));break;
    case"csv":downloadFile(KIND_NAME[b.dataset.kind]+".csv","﻿"+tableRows(b.dataset.kind).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8");break;
    case"export-copy":copyText(JSON.stringify(S,null,1));break;
    case"export-dl":downloadFile("بيانات-تسعير-المراتب-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(S,null,1),"application/json");break;
    case"import":{let o;try{o=JSON.parse($("#import-box").value);}catch(_){toast("البيانات مش مفهومة — اتأكد إنك نسخت الملف كله");break;}
      if(!o||!Array.isArray(o.items)||!Array.isArray(o.models)||!o.settings){toast("الملف ده مش بيانات تسعير مراتب");break;}
      S=o;normalize();markDirty();renderBanners();view="items";renderView();toast("اتستوردت ✓ وبتتحفظ");break;}
    case"gen-pw":$("#v-pw").value=genPassword();break;
    case"copy-creds":copyText(newCreds);break;
    case"reset-pw":{const p=genPassword();if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="متأكد؟";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="كلمة سر جديدة";}},3000);break;}
      const {error}=await sb.rpc("reset_member_password",{p_user_id:urow.dataset.uid,p_password:p});if(error){toast(errMsg(error));break;}
      newCreds=credsText(urow.dataset.email,p);toast("اتغيّرت ✓ — ابعتله البيانات الجديدة");loadUsers();break;}
    case"del-user":{if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="متأكد؟";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="حذف";}},3000);break;}
      const {error}=await sb.rpc("delete_member",{p_user_id:urow.dataset.uid});if(error){toast(errMsg(error));break;}toast("اتمسح");loadUsers();break;}
  }
});

boot().catch(err=>renderMessage("حصل خطأ",esc(errMsg(err))));
})();
</script>
