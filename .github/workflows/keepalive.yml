name: Keep Supabase awake

# Free Supabase projects pause after a week without activity.
# A tiny call every 3 days keeps the database awake.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: https://qaiyjxooiefcxzzigrpo.supabase.co
          SUPABASE_KEY: sb_publishable_LN6iGi6CxEvm6HZHC6fIrQ_6iuhmfd9
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
